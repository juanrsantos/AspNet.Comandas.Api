services:
  comandas.api:
    image: ${DOCKER_REGISTRY-}comandasapi
    build:
      context: .
      dockerfile: Comandas.Api/Dockerfile
    networks: 
      - comanda
      - comanda_shared
  mysql:
    image: mysql:latest
    environment: 
      MYSQL_DATABASE: comandas
      MYSQL_USER: usuario
      MYSQL_PASSWORD: rootpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - comandas_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - comanda
  # phpmyadmin:
  #   image: phpmyadmin
  #   restart: always
  #   ports:
  #     - 8080:80
  #   environment:
  #     - PMA_ARBITRARY=1
  #   networks:
  #     - comanda
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "SqlServer2019!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_db_data:/var/opt/mssql 
    networks:
      - comanda
  mssqltools:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - sqlserver
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    networks:
      - comanda
  redis:
    image: redis:latest
    ports:
     - "6379:6379" 
    networks:
     - comanda
    volumes:
     - redis_data:/data
  redis-commander:
     image: rediscommander/redis-commander:latest
     environment:
      - REDIS_HOSTS=local:redis:6379
     ports:
      - "8081:8081"
     depends_on:
      - redis
     networks:
      - comanda
  pulsar:
    image: apachepulsar/pulsar:latest
    command: >
      bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8082:8082"
    networks:
      - comanda
      - comanda_shared
volumes:
  comandas_db_data:
  sql_db_data:
  redis_data:
networks:
  comanda: 
  comanda_shared:
   external: true
  

